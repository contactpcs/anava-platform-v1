services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      SOCKETIO_CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_results:/app/results
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  brain-mapping:
    build:
      context: ./brain-mapping
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./brain-mapping/.env
    environment:
      NEUROWELLNESS_API_URL: http://backend:8000
      PYVISTA_OFF_SCREEN: "true"
    volumes:
      - brain_mapping_results:/app/results
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BRAIN_MAPPING_URL: http://localhost:8001
    depends_on:
      - backend

volumes:
  redis_data:
  backend_uploads:
  backend_results:
  brain_mapping_results:
